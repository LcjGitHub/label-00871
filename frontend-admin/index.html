<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机抽签系统 - 公平、公正、公开</title>
    <meta name="description" content="基于Web的现代化随机抽签系统">

    <!-- 样式文件引入 -->
    <link rel="stylesheet" href="src/css/variables.css">
    <link rel="stylesheet" href="src/css/base.css">
    <link rel="stylesheet" href="src/css/components.css">
    <link rel="stylesheet" href="src/css/animations.css">
    <link rel="stylesheet" href="src/css/responsive.css">
</head>
<body>

    <!-- 头部区域 - 占满屏幕宽度 -->
    <header class="app-header" role="banner">

        <div class="header-content">
            <div class="header-decoration header-decoration-left"></div>
            <div class="header-decoration header-decoration-right"></div>
            <div class="header-inner">
                <h1 class="logo">
                    <span class="icon" aria-hidden="true">🎲</span>
                    <span class="logo-text">
                        <span class="logo-main">随机抽签系统</span>
                        <span class="logo-sub">Random Lottery System</span>
                    </span>
                </h1>
                <p class="subtitle">公平公正 · 极速抽选 · 数据驱动</p>
                <div class="header-features">
                    <span class="feature-item">⚡ 极速响应</span>
                    <span class="feature-item">🎯 公平随机</span>
                    <span class="feature-item">📊 数据可视</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <div class="app-container">
        <main class="app-main" role="main">
            <!-- 结果展示区域 -->
            <section class="result-section card" aria-labelledby="result-heading">
                <div class="result-header">
                    <div class="result-title-group">
                        <span class="result-icon">🎯</span>
                        <h2 id="result-heading">抽签结果</h2>
                    </div>
                    <div class="result-stats">
                        <span class="stat-item">
                            <span id="total-count-badge" class="badge" aria-live="polite" aria-atomic="true">加载中...</span>
                        </span>
                    </div>
                </div>

                <!-- 滚动显示窗口 -->
                <div class="lottery-window-wrapper">
                    <div class="lottery-window" id="lottery-window" role="region" aria-label="抽签滚动显示区域">
                        <div class="lottery-window-decoration"></div>
                        <div class="placeholder-text" id="placeholder-text">
                            <span class="placeholder-icon">✨</span>
                            <span class="placeholder-message">点击"开始抽签"启动</span>
                        </div>
                        <ul class="lottery-list" id="lottery-list" role="list" aria-live="polite">
                            <!-- 动态生成的候选项将在这里滚动 -->
                        </ul>
                    </div>
                </div>

                <!-- 最终中奖名单展示区 -->
                <div class="winners-section" id="winners-section" style="display: none;">
                    <div class="winners-header">
                        <span class="winners-icon">🏆</span>
                        <h3 class="winners-title">中奖名单</h3>
                    </div>
                    <div class="winners-display" id="winners-display" role="list" aria-label="中奖名单">
                        <!-- 中奖卡片 -->
                    </div>
                </div>
            </section>

            <!-- 操作控制区域 -->
            <section class="control-section card" aria-labelledby="control-heading">
                <div class="control-header">
                    <span class="control-icon">⚙️</span>
                    <h3 id="control-heading">抽签控制</h3>
                </div>

                <div class="settings-group">
                    <div class="setting-item">
                        <label for="speed-select" class="setting-label">
                            <span class="label-icon">⏱️</span>
                            <span class="label-text">滚动速度</span>
                        </label>
                        <select id="speed-select" class="form-select" aria-describedby="speed-desc">
                            <option value="slow">🐌 慢速 (营造悬念)</option>
                            <option value="normal" selected>⚡ 中速 (标准)</option>
                            <option value="fast">🚀 快速 (高效)</option>
                        </select>
                        <span id="speed-desc" class="setting-hint">选择抽签动画的滚动速度</span>
                    </div>

                    <div class="setting-item">
                        <label for="count-select" class="setting-label">
                            <span class="label-icon">👥</span>
                            <span class="label-text">抽取数量</span>
                        </label>
                        <select id="count-select" class="form-select" aria-describedby="count-desc">
                            <option value="1" selected>1 人</option>
                            <option value="3">3 人</option>
                            <option value="5">5 人</option>
                            <option value="10">10 人</option>
                        </select>
                        <span id="count-desc" class="setting-hint">选择一次抽取的人数</span>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="btn-start" class="btn btn-primary btn-start" aria-label="开始抽签">
                        <span class="btn-icon">🎲</span>
                        <span class="btn-text">开始抽签</span>
                    </button>
                    <button id="btn-reset" class="btn btn-secondary btn-reset" disabled aria-label="重置抽签结果">
                        <span class="btn-icon">🔄</span>
                        <span class="btn-text">重置</span>
                    </button>
                </div>
            </section>
        </main>
    </div>

    <!-- 底部版权 - 占满屏幕宽度 -->
    <footer class="app-footer" role="contentinfo">
        <div class="footer-content">
            <p class="footer-copyright">&copy; 2026 Random Lottery System. All rights reserved.</p>
            <p class="footer-version">Version 1.0.0 | Built with ❤️</p>
        </div>
    </footer>

    <!-- 全局消息提示容器 - 固定在页面顶部中间 -->
    <div id="toast-container" class="toast-container"></div>

    <!-- 脚本引入 (使用 type="module") -->
    <script type="module" src="src/js/main.js"></script>
</body>
</html>
